<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <style>
      :root {
        --icon-bg: #141414;
        --icon-fg: #ffffff;
        --icon-accent: #0066ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --icon-bg: #ffffff;
          --icon-fg: #141414;
          --icon-accent: #0066ff;
        }
      }
      .bg-tile { fill: var(--icon-bg); }
      .fg-mark { stroke: var(--icon-fg); }
      .accent-mark { stroke: var(--icon-accent); }
    </style>
  </defs>

  <!-- 30% iOS Squircle Base Tile -->
  <rect class="bg-tile" x="1" y="1" width="30" height="30" rx="9" ry="9" />

  <!-- Precision Measurement Calibrations (Ruler Ticks) -->
  <line class="fg-mark" x1="7" y1="7.5" x2="7" y2="12" stroke-width="1.75" stroke-linecap="round" />
  <line class="fg-mark" x1="11.5" y1="7.5" x2="11.5" y2="10.5" stroke-width="1.5" stroke-linecap="round" />
  <!-- Center Electric Blue Accent Gauge -->
  <line class="accent-mark" x1="16" y1="7.5" x2="16" y2="13.5" stroke-width="2" stroke-linecap="round" />
  <line class="fg-mark" x1="20.5" y1="7.5" x2="20.5" y2="10.5" stroke-width="1.5" stroke-linecap="round" />
  <line class="fg-mark" x1="25" y1="7.5" x2="25" y2="12" stroke-width="1.75" stroke-linecap="round" />

  <!-- Dimensional Measure Baseline & Bidirectional Resize Arrows -->
  <line class="fg-mark" x1="7" y1="18.5" x2="25" y2="18.5" stroke-width="1.75" stroke-linecap="round" />
  <path class="fg-mark" d="M10 15.5L7 18.5L10 21.5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <path class="fg-mark" d="M22 15.5L25 18.5L22 21.5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Center Point -->
  <circle cx="16" cy="18.5" r="1.25" fill="#0066ff" />
  <line class="accent-mark" x1="16" y1="22" x2="16" y2="24.5" stroke-width="1.75" stroke-linecap="round" />
</svg>
